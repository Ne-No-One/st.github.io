<!-- Сучасна шапка сайту -->
<header class="site-header">
    <div class="container-header">
        <div class="header-content">
            <!-- Logo -->
            <div class="logo-section">
                <a href="/" class="logo-link">
                    <i class="fas fa-seedling logo-icon"></i>
                    <span class="logo-text">{{ site_title|default:"Квітковий" }}</span>
                </a>
            </div>
            
            <!-- Navigation -->
            <nav class="main-nav">
                <a href="/" class="nav-link">
                    <i class="fas fa-home"></i>
                    <span>Головна</span>
                </a>
                <a href="/#about" class="nav-link">
                    <i class="fas fa-info-circle"></i>
                    <span>Про нас</span>
                </a>
                <a href="/#contact" class="nav-link">
                    <i class="fas fa-envelope"></i>
                    <span>Контакти</span>
                </a>
            </nav>
            
            <!-- Actions -->
            <div class="header-actions">
                <!-- Theme Switcher -->
                <button class="theme-toggle" onclick="toggleSiteTheme()" title="Перемикач теми">
                    <i class="fas fa-moon theme-icon"></i>
                </button>
                
                <!-- B2B Button -->
                <button class="b2b-btn">
                    <i class="fas fa-briefcase"></i>
                    <span>{{ b2b_button_text|default:"B2B" }}</span>
                </button>
                
                <!-- Cart -->
                <div class="cart-widget" onclick="window.location.href='/cart/'">
                    <i class="fas fa-shopping-cart cart-icon"></i>
                    <span class="cart-badge" id="headerCartCount">0</span>
                </div>
                
                <!-- Mobile Menu Toggle -->
                <button class="mobile-menu-toggle" onclick="toggleMobileMenu()">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
        </div>
        
        <!-- Mobile Navigation -->
        <div class="mobile-nav" id="mobileNav">
            <a href="/" class="mobile-nav-link">
                <i class="fas fa-home"></i>
                Головна
            </a>
            <a href="/#about" class="mobile-nav-link">
                <i class="fas fa-info-circle"></i>
                Про нас
            </a>
            <a href="/#contact" class="mobile-nav-link">
                <i class="fas fa-envelope"></i>
                Контакти
            </a>
        </div>
    </div>
</header>

<script>
// Mobile menu toggle
function toggleMobileMenu() {
    const mobileNav = document.getElementById('mobileNav');
    mobileNav.classList.toggle('active');
}

// Theme toggle
function toggleSiteTheme() {
    const body = document.body;
    const icon = document.querySelector('.theme-icon');
    
    if (body.classList.contains('light-theme')) {
        body.classList.remove('light-theme');
        icon.className = 'fas fa-moon theme-icon';
        localStorage.setItem('site-theme', 'dark');
    } else {
        body.classList.add('light-theme');
        icon.className = 'fas fa-sun theme-icon';
        localStorage.setItem('site-theme', 'light');
    }
}

// Load saved theme
document.addEventListener('DOMContentLoaded', function() {
    const savedTheme = localStorage.getItem('site-theme');
    const icon = document.querySelector('.theme-icon');
    
    if (savedTheme === 'light') {
        document.body.classList.add('light-theme');
        if (icon) icon.className = 'fas fa-sun theme-icon';
    }
});
</script>
