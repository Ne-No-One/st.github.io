<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Pay - Тестовий режим</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Використовуємо стилі магазину для body */
        body {
            background: #000;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        
        /* Плаваючі білі шари як на головній сторінці */
        .floating-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        
        .shape {
            position: absolute;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 50%;
            animation: float 20s infinite ease-in-out;
        }
        
        .shape-1 {
            width: 300px;
            height: 300px;
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }
        
        .shape-2 {
            width: 200px;
            height: 200px;
            top: 60%;
            right: 15%;
            animation-delay: 2s;
        }
        
        .shape-3 {
            width: 250px;
            height: 250px;
            bottom: 20%;
            left: 20%;
            animation-delay: 4s;
        }
        
        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(30px, -30px) rotate(120deg); }
            66% { transform: translate(-20px, 20px) rotate(240deg); }
        }

        .payment-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .test-badge {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            display: inline-block;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .google-pay-logo {
            font-size: 4rem;
            margin: 20px 0;
            background: linear-gradient(135deg, #4285F4 0%, #34A853 50%, #FBBC05 75%, #EA4335 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .payment-title {
            font-size: 1.8rem;
            margin-bottom: 10px;
            color: #333;
        }

        .payment-subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .order-info {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .order-info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #dee2e6;
        }

        .order-info-row:last-child {
            border-bottom: none;
            font-weight: bold;
            font-size: 1.2rem;
            color: #4285F4;
        }

        .google-pay-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #4285F4;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
            margin-bottom: 15px;
        }

        .google-pay-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(66, 133, 244, 0.3);
        }

        .info-text {
            font-size: 0.9rem;
            color: #666;
            margin: 20px 0;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #4285F4;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <!-- Плаваючі білі шари -->
    <div class="floating-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <div class="payment-container">
        <div class="test-badge">
            <i class="fas fa-flask"></i> ТЕСТОВИЙ РЕЖИМ
        </div>

        <div class="google-pay-logo">
            <i class="fab fa-google"></i>
        </div>

        <h1 class="payment-title">
            Google Pay
        </h1>
        <p class="payment-subtitle">
            Швидка та безпечна оплата
        </p>

        <div class="order-info">
            <div class="order-info-row">
                <span>Номер замовлення:</span>
                <span><strong>{{ order_id }}</strong></span>
            </div>
            <div class="order-info-row">
                <span>Товарів:</span>
                <span>{{ items_count }}</span>
            </div>
            <div class="order-info-row">
                <span>Сума до сплати:</span>
                <span><strong>{{ amount }} грн</strong></span>
            </div>
        </div>

        <button class="google-pay-btn" onclick="processPayment()">
            <i class="fab fa-google"></i>
            Оплатити з Google Pay
        </button>

        <p class="info-text">
            <i class="fas fa-shield-alt"></i>
            Ваші платіжні дані захищені та не передаються продавцю
        </p>

        <a href="/cart/" class="back-link">
            <i class="fas fa-arrow-left"></i>
            Повернутися до кошика
        </a>
    </div>

    <script>
        function processPayment() {
            // Симуляція Google Pay
            const orderId = '{{ order_id }}';
            const amount = '{{ amount }}';
            window.location.href = `/payment/test/simulation/?order_id=${orderId}&amount=${amount}&items={{ items_count }}`;
        }
    </script>
</body>
</html>
