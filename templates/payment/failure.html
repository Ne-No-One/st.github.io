<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if title %}{{ title }}{% else %}Помилка оплати{% endif %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- Плаваючі білі шари -->
    <div class="floating-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
        <div class="shape shape-4"></div>
        <div class="shape shape-5"></div>
    </div>

    <!-- Шапка сайту -->
    <header class="header">
        <nav class="navbar">
            <div class="nav-brand">
                <h1><a href="/" style="text-decoration: none; color: inherit;">Квітковий магазин</a></h1>
            </div>
        </nav>
    </header>

    <!-- Основний контент -->
    <main class="payment-page">
        <div class="payment-container">
            <div class="payment-card failure">
                <div class="payment-icon">
                    <i class="fas fa-times-circle"></i>
                </div>
                <h1 class="payment-title">Помилка оплати</h1>
                <p class="payment-message">
                    На жаль, сталася помилка при обробці вашого платежу. Будь ласка, спробуйте ще раз або оберіть інший спосіб оплати.
                </p>
                <div class="payment-details">
                    <div class="detail-item">
                        <i class="fas fa-info-circle"></i>
                        <span>Перевірте дані картки</span>
                    </div>
                    <div class="detail-item">
                        <i class="fas fa-phone"></i>
                        <span>Зв'яжіться з нами для допомоги</span>
                    </div>
                    <div class="detail-item">
                        <i class="fas fa-credit-card"></i>
                        <span>Спробуйте інший спосіб оплати</span>
                    </div>
                </div>
                <div class="payment-actions">
                    <a href="/cart/" class="btn btn-primary">
                        <i class="fas fa-redo"></i>
                        Спробувати ще раз
                    </a>
                    <a href="/" class="btn btn-secondary">
                        <i class="fas fa-home"></i>
                        На головну
                    </a>
                </div>
            </div>
        </div>
    </main>

    <style>
        .payment-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
        }

        .payment-container {
            max-width: 500px;
            width: 100%;
        }

        .payment-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            animation: slideUp 0.6s ease-out;
        }

        .payment-card.success {
            border-top: 5px solid #4CAF50;
        }

        .payment-card.failure {
            border-top: 5px solid #f44336;
        }

        .payment-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        .payment-card.success .payment-icon {
            color: #4CAF50;
        }

        .payment-card.failure .payment-icon {
            color: #f44336;
        }

        .payment-title {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: #333;
        }

        .payment-message {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .payment-details {
            margin-bottom: 30px;
        }

        .detail-item {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            color: #666;
        }

        .detail-item i {
            margin-right: 10px;
            color: #f44336;
        }

        .payment-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            padding: 12px 24px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .btn i {
            margin-right: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 107, 107, 0.3);
        }

        .btn-secondary {
            background: #f8f9fa;
            color: #333;
            border: 2px solid #e9ecef;
        }

        .btn-secondary:hover {
            background: #e9ecef;
            transform: translateY(-2px);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .payment-card {
                padding: 30px 20px;
            }

            .payment-title {
                font-size: 2rem;
            }

            .payment-actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</body>
</html>
