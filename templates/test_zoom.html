<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔍 Тест Zoom Системи</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .header p {
            color: rgba(255,255,255,0.7);
            font-size: 1.1rem;
        }
        
        .test-container {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 40px;
            max-width: 900px;
            width: 100%;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        
        .image-container {
            position: relative;
            width: 100%;
            height: 500px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 30px;
            border: 2px solid rgba(255,255,255,0.2);
        }
        
        .test-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://images.unsplash.com/photo-1490750967868-88aa4486c946?w=800');
            background-position: center;
            background-repeat: no-repeat;
            /* Ключова властивість для zoom */
            background-size: var(--image-zoom, 100%) var(--image-zoom, 100%);
            transition: background-size 0.3s ease;
        }
        
        .controls {
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
        }
        
        .control-group {
            margin-bottom: 20px;
        }
        
        .control-group:last-child {
            margin-bottom: 0;
        }
        
        .control-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-weight: 600;
            font-size: 1.1rem;
        }
        
        .zoom-value {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 1rem;
            font-weight: bold;
            min-width: 80px;
            text-align: center;
        }
        
        .zoom-slider {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: rgba(255,255,255,0.1);
            outline: none;
            -webkit-appearance: none;
            cursor: pointer;
        }
        
        .zoom-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.5);
            transition: all 0.2s;
        }
        
        .zoom-slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            box-shadow: 0 4px 16px rgba(102, 126, 234, 0.8);
        }
        
        .zoom-slider::-moz-range-thumb {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.5);
            transition: all 0.2s;
        }
        
        .zoom-slider::-moz-range-thumb:hover {
            transform: scale(1.2);
            box-shadow: 0 4px 16px rgba(102, 126, 234, 0.8);
        }
        
        .scale-markers {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 0.85rem;
            color: rgba(255,255,255,0.5);
        }
        
        .button-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
        }
        
        .test-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }
        
        .test-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }
        
        .test-button:active {
            transform: translateY(0);
        }
        
        .info-panel {
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
        }
        
        .info-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: #667eea;
        }
        
        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .info-item:last-child {
            border-bottom: none;
        }
        
        .info-label {
            color: rgba(255,255,255,0.7);
        }
        
        .info-value {
            font-weight: 600;
            color: #fff;
            font-family: 'Courier New', monospace;
        }
        
        .log-console {
            background: #000;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid rgba(102, 126, 234, 0.3);
        }
        
        .log-entry {
            margin-bottom: 5px;
            color: #0f0;
        }
        
        .log-entry.error {
            color: #f00;
        }
        
        .log-entry.warning {
            color: #ff0;
        }
        
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8rem;
            }
            
            .test-container {
                padding: 20px;
            }
            
            .image-container {
                height: 300px;
            }
            
            .button-group {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🔍 Тестування Zoom Системи</h1>
        <p>Простий тест для налагодження масштабування зображень</p>
    </div>
    
    <div class="test-container">
        <!-- Контейнер з зображенням -->
        <div class="image-container">
            <div class="test-image" id="testImage"></div>
        </div>
        
        <!-- Елементи керування -->
        <div class="controls">
            <div class="control-group">
                <div class="control-label">
                    <span>🎚️ Zoom рівень</span>
                    <span class="zoom-value" id="zoomValue">100%</span>
                </div>
                <input type="range" 
                       class="zoom-slider" 
                       id="zoomSlider" 
                       min="50" 
                       max="200" 
                       value="100" 
                       step="5">
                <div class="scale-markers">
                    <span>50%</span>
                    <span>100%</span>
                    <span>150%</span>
                    <span>200%</span>
                </div>
            </div>
            
            <div class="control-group">
                <div class="button-group">
                    <button class="test-button" onclick="setZoom(50)">📉 Мінімум (50%)</button>
                    <button class="test-button" onclick="setZoom(75)">📊 Малий (75%)</button>
                    <button class="test-button" onclick="setZoom(100)">🔄 Скинути (100%)</button>
                    <button class="test-button" onclick="setZoom(125)">📈 Великий (125%)</button>
                    <button class="test-button" onclick="setZoom(150)">📊 Більший (150%)</button>
                    <button class="test-button" onclick="setZoom(200)">📈 Максимум (200%)</button>
                </div>
            </div>
        </div>
        
        <!-- Інформаційна панель -->
        <div class="info-panel">
            <div class="info-title">📊 Технічна інформація</div>
            <div class="info-item">
                <span class="info-label">CSS змінна --image-zoom:</span>
                <span class="info-value" id="cssVarValue">100%</span>
            </div>
            <div class="info-item">
                <span class="info-label">background-size (computed):</span>
                <span class="info-value" id="bgSizeValue">-</span>
            </div>
            <div class="info-item">
                <span class="info-label">Ширина екрану:</span>
                <span class="info-value" id="screenWidth">-</span>
            </div>
            <div class="info-item">
                <span class="info-label">Тип пристрою:</span>
                <span class="info-value" id="deviceType">-</span>
            </div>
            
            <!-- Консоль логів -->
            <div class="log-console" id="logConsole">
                <div class="log-entry">✅ Тестова сторінка завантажена</div>
            </div>
        </div>
    </div>
    
    <script>
        // Елементи DOM
        const testImage = document.getElementById('testImage');
        const zoomSlider = document.getElementById('zoomSlider');
        const zoomValue = document.getElementById('zoomValue');
        const cssVarValue = document.getElementById('cssVarValue');
        const bgSizeValue = document.getElementById('bgSizeValue');
        const screenWidth = document.getElementById('screenWidth');
        const deviceType = document.getElementById('deviceType');
        const logConsole = document.getElementById('logConsole');
        
        // Функція для логування
        function log(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            const timestamp = new Date().toLocaleTimeString();
            entry.textContent = `[${timestamp}] ${message}`;
            logConsole.appendChild(entry);
            logConsole.scrollTop = logConsole.scrollHeight;
            console.log(`${type.toUpperCase()}: ${message}`);
        }
        
        // Функція для оновлення інформації про екран
        function updateScreenInfo() {
            const width = window.innerWidth;
            screenWidth.textContent = `${width}px`;
            
            if (width <= 768) {
                deviceType.textContent = 'Мобільний 📱';
            } else if (width <= 1024) {
                deviceType.textContent = 'Планшет 📱';
            } else {
                deviceType.textContent = 'Desktop 🖥️';
            }
        }
        
        // Функція для застосування zoom
        function applyZoom(zoomPercent) {
            log(`🎯 Застосування zoom: ${zoomPercent}%`);
            
            // 1. Встановлюємо CSS змінну
            testImage.style.setProperty('--image-zoom', `${zoomPercent}%`);
            log(`   └─ CSS змінна встановлена: ${zoomPercent}%`);
            
            // 2. Оновлюємо відображення
            zoomValue.textContent = `${zoomPercent}%`;
            zoomSlider.value = zoomPercent;
            
            // 3. Читаємо реальне значення CSS змінної
            const computedZoom = testImage.style.getPropertyValue('--image-zoom');
            cssVarValue.textContent = computedZoom || 'не встановлено';
            log(`   └─ Прочитано CSS змінну: ${computedZoom}`);
            
            // 4. Читаємо computed background-size
            setTimeout(() => {
                const computedStyle = window.getComputedStyle(testImage);
                const bgSize = computedStyle.backgroundSize;
                bgSizeValue.textContent = bgSize;
                log(`   └─ Computed background-size: ${bgSize}`);
                
                // Перевіряємо чи zoom застосувався
                if (bgSize === 'cover' || bgSize === 'contain') {
                    log(`⚠️ УВАГА: background-size = ${bgSize}, очікувалось ${zoomPercent}% ${zoomPercent}%`, 'warning');
                } else if (bgSize.includes(`${zoomPercent}%`)) {
                    log(`✅ Zoom успішно застосовано!`, 'info');
                } else {
                    log(`❌ Zoom НЕ застосовано! Очікувалось ${zoomPercent}%, отримано ${bgSize}`, 'error');
                }
            }, 100);
        }
        
        // Функція для встановлення конкретного zoom (викликається кнопками)
        function setZoom(percent) {
            applyZoom(percent);
        }
        
        // Обробник ползунка
        zoomSlider.addEventListener('input', function() {
            const zoomPercent = this.value;
            applyZoom(zoomPercent);
        });
        
        // Обробник зміни розміру вікна
        window.addEventListener('resize', function() {
            updateScreenInfo();
            log(`🔄 Розмір вікна змінено: ${window.innerWidth}x${window.innerHeight}`);
        });
        
        // Ініціалізація при завантаженні
        document.addEventListener('DOMContentLoaded', function() {
            log('🚀 Ініціалізація тестової сторінки');
            updateScreenInfo();
            applyZoom(100);
            log('✅ Ініціалізація завершена. Спробуйте змінити zoom!');
        });
        
        // Подвійний клік на зображенні для скидання
        testImage.addEventListener('dblclick', function() {
            log('🔄 Подвійний клік - скидання до 100%');
            setZoom(100);
        });
        
        // Показуємо початкові логи
        log('📱 Браузер: ' + navigator.userAgent.split(' ').pop());
        log('🌐 Платформа: ' + navigator.platform);
    </script>
</body>
</html>
